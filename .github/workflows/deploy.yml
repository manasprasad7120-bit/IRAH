name: Deploy to Hostinger

# Pushing to main builds the site and uploads dist/ to Hostinger over FTPS.
# Nothing built is ever committed - dist/ stays gitignored.
on:
  push:
    branches: [main]
  workflow_dispatch: {} # lets you re-deploy by hand from the Actions tab

concurrency:
  # If two pushes land close together, let the newer one win rather than
  # racing two uploads into the same public_html.
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # No mail secret is needed here. The form posts to /send.php on the same
        # origin, and the SMTP credentials live in mail-config.php on the server
        # - never in the bundle. These two are optional overrides only.
        env:
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}
          VITE_CONTACT_ENDPOINT: ${{ secrets.VITE_CONTACT_ENDPOINT }}
        run: npm run build

      - name: Upload dist/ to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # Trailing slashes matter to this action.
          local-dir: ./dist/
          server-dir: public_html/
          # The action keeps a manifest on the server and uploads only what
          # changed. Set this to true for ONE run if you need to wipe the old
          # PHP site, then set it back to false.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
