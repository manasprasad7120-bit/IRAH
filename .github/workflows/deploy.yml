name: Deploy to Hostinger

# Pushing to main builds the site and uploads dist/ to Hostinger over FTPS.
# Nothing built is ever committed - dist/ stays gitignored.
on:
  push:
    branches: [main]
  workflow_dispatch: {} # lets you re-deploy by hand from the Actions tab

concurrency:
  # If two pushes land close together, let the newer one win rather than
  # racing two uploads into the same public_html.
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # No mail secret is needed here. The form posts to /send.php on the same
        # origin, and the SMTP credentials live in mail-config.php on the server
        # - never in the bundle. These two are optional overrides only.
        env:
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}
          VITE_CONTACT_ENDPOINT: ${{ secrets.VITE_CONTACT_ENDPOINT }}
        run: npm run build

      - name: Upload dist/ to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # Default is 30s. Hostinger's shared FTP can be slow to answer,
          # especially after several connections in quick succession, which
          # trips their brute-force protection and stalls the control socket.
          timeout: 60000
          # Trailing slashes matter to this action.
          local-dir: ./dist/
          # LEADING SLASH IS REQUIRED.
          #
          # irahsolution.com's document root, confirmed via PHP DOCUMENT_ROOT:
          #   /home/u810475650/domains/irahsolution.com/public_html
          #
          # The FTP login lands INSIDE /public_html, not at the home directory,
          # so a relative path here resolves from there - "public_html/" created
          # public_html/public_html/, and "domains/..." created
          # public_html/domains/... Both uploaded fine and neither was served.
          # The leading slash anchors the path to the FTP root instead.
          server-dir: /domains/irahsolution.com/public_html/
          # Keep this false. The action uploads only what changed and leaves
          # everything else alone, which is what we want - with it set to true a
          # deploy deletes anything in the document root that is not in the
          # repo, including files you upload by hand.
          #
          # It was switched on for one run to force a full republish after a
          # stale .ftp-deploy-sync-state.json made the action think the server
          # was already in sync. If that ever happens again, delete that file on
          # the server rather than turning this back on.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
